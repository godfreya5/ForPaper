<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Status</title>
    <style>
        /* ========== Notion Style Design System ========== */
        :root {
            --notion-bg: #ffffff;
            --notion-sidebar: #f7f6f3;
            --notion-text: #37352f;
            --notion-text-muted: #787774;
            --notion-border: rgba(55, 53, 47, 0.1);
            --notion-hover: rgba(55, 53, 47, 0.04);
            --notion-badge-bg: rgba(55, 53, 47, 0.08);
            --notion-accent: #000000;

            --success-bg: #edf6f2;
            --success-text: #0f7b5f;
            --error-bg: #fdf2f2;
            --error-text: #d44040;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --notion-bg: #191919;
                --notion-sidebar: #202020;
                --notion-text: #ffffff;
                --notion-text-muted: #9b9b9b;
                --notion-border: rgba(255, 255, 255, 0.1);
                --notion-hover: rgba(255, 255, 255, 0.05);
                --notion-badge-bg: rgba(255, 255, 255, 0.1);
                --notion-accent: #ffffff;

                --success-bg: rgba(15, 123, 95, 0.15);
                --success-text: #2ea785;
                --error-bg: rgba(212, 64, 64, 0.15);
                --error-text: #ff7373;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--notion-bg);
            color: var(--notion-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 12px 20px;
        }

        #root {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 24px);
            margin: 0 auto;
            position: relative;
            padding-bottom: 38px;
        }

        body.login-mode #root {
            justify-content: center;
        }

        body.login-mode .page-title {
            flex: 0 0 auto;
        }

        body.login-mode #login-view {
            flex: 0 0 auto;
        }

        .version-note {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            text-align: center;
            font-size: 11px;
            line-height: 1.35;
            color: var(--notion-text-muted);
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            padding: 0 4px;
        }

        .version-note a {
            color: #2383e2;
            text-decoration: underline;
            cursor: pointer;
        }

        /* ========== Typography & Headers ========== */
        .page-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.02em;
            text-align: center;
        }

        /* ========== Auth Views ========== */
        #login-view {
            animation: fadeIn 0.3s ease;
            display: flex;
            flex: 1 1 auto;
            align-items: center;
        }

        #login-view #auth-form {
            width: 100%;
        }

        #logged-in-view {
            padding-top: 6px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--notion-text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--notion-sidebar);
            border: 1px solid var(--notion-border);
            border-radius: 8px;
            color: var(--notion-text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--notion-text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--notion-border);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--notion-accent);
            color: var(--notion-bg);
            border: none;
            width: 100%;
        }

        .btn-primary:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .helper-link-row {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: var(--notion-text-muted);
        }

        .helper-link-row a {
            color: #2383e2;
            text-decoration: underline;
            cursor: pointer;
        }

        .btn-ghost {
            background: transparent;
            color: var(--notion-text);
            width: auto;
            padding: 4px;
            border: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-ghost:hover {
            background: var(--notion-hover);
            opacity: 1;
        }

        /* ========== Account Info (Logged In) ========== */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .user-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 17px;
            font-weight: 600;
        }

        .sub-meta {
            display: flex;
            align-items: center;
            /* 改为居中对齐 */
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: var(--notion-badge-bg);
            color: var(--notion-text);
        }

        /* 订阅等级铭牌：Lite 浅绿透 / Pro 蓝透 / Ultimate 紫色 */
        /* 品牌蓝 #3775de = rgb(55, 117, 222) */
        .badge.tier-lite {
            background: rgba(34, 197, 94, 0.1);
            color: #166534;
        }

        .badge.tier-pro {
            background: rgba(55, 117, 222, 0.24);
            color: #1a5496;
        }

        .badge.tier-ultimate {
            background: #f1f0ff;
            color: #6a1b9a;
        }

        @media (prefers-color-scheme: dark) {
            .badge.tier-lite {
                background: rgba(74, 222, 128, 0.16);
                color: #86efac;
            }

            .badge.tier-pro {
                background: rgba(55, 117, 222, 0.34);
                color: #bfdbfe;
            }

            .badge.tier-ultimate {
                background: #3c245c;
                color: #d1b3ff;
            }
        }

        .expiry-text {
            font-size: 12px;
            color: var(--notion-text-muted);
        }

        /* ========== Balance Section ========== */
        .balance-section {
            margin-bottom: 12px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--notion-border);
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--notion-text-muted);
        }

        .refresh-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            color: var(--notion-text-muted);
            display: flex;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: var(--notion-hover);
            color: var(--notion-text);
        }

        .refresh-btn.loading svg {
            animation: spin 1s linear infinite;
        }

        .balance-grid {
            display: grid;
            gap: 8px;
        }

        .balance-card {
            padding: 9px 14px;
            background: var(--notion-sidebar);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 13px;
            color: var(--notion-text-muted);
        }

        .balance-main-value {
            font-size: 20px;
            font-weight: 600;
            margin-top: 2px;
        }

        .balance-detail {
            font-size: 11px;
            color: var(--notion-text-muted);
            margin-top: 2px;
        }

        .pricing-detail-block {
            margin-top: 8px;
            border-top: 1px dotted var(--notion-border);
            padding-top: 6px;
        }

        .pricing-detail-block .balance-detail {
            line-height: 1.45;
        }

        /* ========== Utility ========== */
        .status-box {
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .status-box.success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status-box.error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #balance-loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: 10;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* ========== Cloud Sync Section ========== */
        .sync-section {
            margin-bottom: 0;
        }

        .sync-info-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .sync-info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            margin-left: 5px;
            border-radius: 50%;
            border: 1.5px solid var(--notion-text-muted);
            color: var(--notion-text-muted);
            font-size: 10px;
            font-weight: 600;
            font-style: italic;
            font-family: Georgia, serif;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .sync-info-icon:hover {
            border-color: var(--notion-text);
            color: var(--notion-text);
        }

        .sync-info-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            z-index: 100;
            width: 280px;
            padding: 12px 14px;
            background: var(--notion-bg);
            border: 1px solid var(--notion-border);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            font-size: 12px;
            line-height: 1.6;
            color: var(--notion-text);
        }

        .sync-info-tooltip.visible {
            display: block;
        }

        .sync-info-tooltip .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .sync-info-tooltip .tooltip-title {
            font-weight: 600;
            font-size: 12px;
        }

        .sync-info-tooltip .tooltip-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--notion-text-muted);
            font-size: 16px;
            line-height: 1;
            padding: 0 0 0 8px;
            transition: color 0.2s;
        }

        .sync-info-tooltip .tooltip-close:hover {
            color: var(--notion-text);
        }

        .sync-info-tooltip .tooltip-steps {
            margin: 0;
            padding-left: 18px;
            color: var(--notion-text-muted);
        }

        .sync-info-tooltip .tooltip-steps li {
            margin-bottom: 3px;
        }

        .sync-info-tooltip .tooltip-warning {
            margin-top: 6px;
            color: var(--error-text, #e03e3e);
            font-size: 11px;
            font-weight: 500;
        }

        .sync-info-tooltip .tooltip-divider {
            border: none;
            border-top: 1px dashed var(--notion-border);
            margin: 8px 0;
        }

        .sync-info-tooltip .tooltip-footer {
            font-size: 11px;
            color: var(--notion-text-muted);
        }

        .full-sync-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .full-sync-btn {
            display: inline-block;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 500;
            color: var(--notion-text);
            background: var(--notion-sidebar);
            border: 1px solid var(--notion-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .full-sync-btn:hover:not(:disabled) {
            background: var(--notion-hover);
            border-color: var(--notion-text-muted);
        }

        .full-sync-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .full-sync-hint {
            font-size: 10px;
            color: var(--notion-text-muted);
            white-space: nowrap;
        }

        .sync-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--notion-border);
            background: var(--notion-sidebar);
            color: var(--notion-text);
            transition: all 0.2s;
        }

        .sync-btn:hover:not(:disabled) {
            background: var(--notion-hover);
            border-color: var(--notion-text-muted);
        }

        .sync-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .sync-btn .sync-icon {
            display: flex;
            transition: transform 0.3s;
        }

        .sync-btn.syncing .sync-icon {
            animation: spin 1s linear infinite;
        }

        .sync-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--notion-text-muted);
        }

        .sync-result {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            display: none;
        }

        .sync-result.success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .sync-result.error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
        }

        .sync-result.info {
            display: block;
            background: var(--notion-sidebar);
            color: var(--notion-text-muted);
        }
    </style>
</head>

<body>
    <div id="root">
        <h1 class="page-title" id="page-title">账户中心</h1>

        <div id="status-message" class="status-box"></div>

        <!-- Login View -->
        <div id="login-view">
            <form id="auth-form">
                <div class="form-group">
                    <label class="form-label">邮箱地址</label>
                    <input type="email" class="form-input" id="email" placeholder="example@email.com" required />
                </div>
                <div class="form-group">
                    <label class="form-label">账户密码</label>
                    <input type="password" class="form-input" id="password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top: 8px;">登录</button>
                <div class="helper-link-row">
                    还未注册？
                    <a href="#" onclick="event.preventDefault(); openExternalURL(getViberoWebsiteBaseURL());">前往官网注册</a>
                </div>
            </form>
        </div>

        <!-- Logged In View -->
        <div id="logged-in-view" style="display: none;">
            <div class="profile-section">
                <div class="user-header-row">
                    <div class="user-email" id="user-email">...</div>
                    <button class="btn btn-ghost" id="logout-btn" title="退出登录">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="sub-meta">
                    <span class="badge" id="sub-status">...</span>
                    <span class="expiry-text" id="sub-date" style="line-height: 1.4;"></span>
                    <a id="buy-link" href="#"
                        onclick="event.preventDefault(); openExternalURL(getViberoPricingURL());"
                        style="display: none; font-size: 12px; color: #2383e2; text-decoration: underline; cursor: pointer;">购买余额</a>
                </div>
            </div>

            <div class="balance-section">
                <div class="section-header">
                    <span class="section-title">资源用量</span>
                    <button id="refresh-balance-btn" class="refresh-btn" title="点击刷新">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </div>

                <div class="balance-grid">
                    <!-- Card 1: Unified Credits -->
                    <div class="balance-card" style="grid-column: span 2;">
                        <div class="balance-info" style="width: 100%;">
                            <span class="balance-label" id="credits-label">Credits</span>
                            <div class="balance-main-value">
                                <span id="credits-balance">0</span>
                            </div>
                            <span class="balance-detail" id="credits-detail"></span>

                            <div class="pricing-detail-block">
                                <span class="balance-detail" style="color: var(--notion-text-muted);">1页论文解析 = 1
                                    Credit<br>基础模型1次AI对话 = 4 Credits<br>高级模型1次AI对话 = 6-8 Credits<br>（AI对话若文章页数超过50页需额外收费）</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cloud Sync Section -->
            <div class="sync-section">
                <div class="section-header">
                    <span class="sync-info-wrapper">
                        <span class="section-title">数据同步</span>
                        <span class="sync-info-icon" onclick="toggleSyncTooltip(event)">i</span>
                        <div class="sync-info-tooltip" id="sync-info-tooltip" onclick="event.stopPropagation();">
                            <div class="tooltip-header">
                                <span class="tooltip-title">云同步步骤：</span>
                                <button class="tooltip-close" onclick="closeSyncTooltip()">&times;</button>
                            </div>
                            <ol class="tooltip-steps">
                                <li>在设备A点云同步，等待上传完成</li>
                                <li>A上传完成后，在设备B点云同步，下载A传过来的数据</li>
                            </ol>
                            <div class="tooltip-warning">（请勿多端同时同步；同步期间请勿退出软件）</div>
                            <hr class="tooltip-divider">
                            <div class="tooltip-footer">
                                若同步完成后仍有数据未同步成功，点击
                                <span class="full-sync-action">
                                    <button class="full-sync-btn" id="full-sync-btn" onclick="handleFullSync(event)">全量同步</button>
                                    <span class="full-sync-hint">（需要较长时间）</span>
                                </span>
                            </div>
                        </div>
                    </span>
                </div>
                <button id="sync-btn" class="sync-btn" onclick="handleSync()">
                    <span class="sync-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </span>
                    <span class="sync-label">同步数据</span>
                </button>
                <div class="sync-status-row">
                    <span id="sync-last-time">上次同步：从未</span>
                </div>
                <div id="sync-quota-row" class="sync-status-row" style="margin-top: 4px; display: none;">
                    <span id="sync-quota-text" style="font-size: 12px; color: var(--notion-text-muted);"></span>
                </div>
                <div id="sync-result" class="sync-result"></div>
            </div>

            <!-- Keep hidden for reference if needed, but UI is moved -->
            <button class="btn btn-ghost" id="logout-btn-legacy" style="display: none;">退出登录</button>
        </div>

        <div class="version-note" id="version-note">
            <span id="version-note-prefix"></span>
            <br id="version-note-break" style="display: none;">
            <span id="version-note-suffix"></span>
            <a id="version-note-link" href="#" onclick="event.preventDefault(); openExternalURL(this.href);"></a>
        </div>
    </div>

    <script>
        const IS_ZH_LOCALE = String(
            window.parent?.Zotero?.locale || navigator.language || 'en-US'
        ).toLowerCase().startsWith('zh');

        const EN_REPLACEMENTS = new Map([
            ['账户中心', 'Account Center'],
            ['账户登录', 'Account Login'],
            ['邮箱地址', 'Email'],
            ['账户密码', 'Password'],
            ['登录中...', 'Signing in...'],
            ['登录', 'Sign In'],
            ['还未注册？', 'No account yet?'],
            ['前往官网注册', 'Create one on Vibero website'],
            ['退出登录', 'Sign Out'],
            ['购买余额', 'Buy Credits'],
            ['资源用量', 'Usage'],
            ['点击刷新', 'Refresh'],
            ['Credits', 'Credits'],
            ['1页论文解析 = 1', '1 page parse = 1'],
            ['Credit', 'Credit'],
            ['基础模型1次AI对话 = 4 Credits', '1 basic-model chat = 4 Credits'],

        function localizeTextToEnglish(text) {
            if (IS_ZH_LOCALE || !text) return text;
            let next = String(text);
            for (const [zh, en] of EN_REPLACEMENTS.entries()) {
                next = next.split(zh).join(en);
            }
            return next;
        }

        let _isApplyingLocalization = false;
        function localizeDomToEnglish() {
            if (IS_ZH_LOCALE) return;
            if (_isApplyingLocalization) return;
            _isApplyingLocalization = true;

            try {
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                const textNodes = [];
                while (walker.nextNode()) {
                    textNodes.push(walker.currentNode);
                }
                for (const node of textNodes) {
                    const translated = localizeTextToEnglish(node.nodeValue);
                    if (translated !== node.nodeValue) {
                        node.nodeValue = translated;
                    }
                }

                const attrTargets = document.querySelectorAll('[title],[placeholder]');
                for (const el of attrTargets) {
                    if (el.hasAttribute('title')) {
                        const v = el.getAttribute('title');
                        const nv = localizeTextToEnglish(v);
                        if (nv !== v) {
                            el.setAttribute('title', nv);
                        }
                    }
                    if (el.hasAttribute('placeholder')) {
                        const v = el.getAttribute('placeholder');
                        const nv = localizeTextToEnglish(v);
                        if (nv !== v) {
                            el.setAttribute('placeholder', nv);
                        }
                    }
                }
            } finally {
                _isApplyingLocalization = false;
            }
        }

        // Supabase Configuration
        let SUPABASE_URL = '';
        let SUPABASE_ANON_KEY = '';

        try {
            if (window.parent && window.parent.Zotero && window.parent.Zotero.VibeDBSync) {
                const config = window.parent.Zotero.VibeDBSync.getSupabaseConfig();
                SUPABASE_URL = config.url;
                SUPABASE_ANON_KEY = config.anonKey;
            }
        } catch (e) {
            console.error('Config failed:', e);
        }

        const supabaseAuth = {
            _session: null,
            async signInWithPassword({ email, password }) {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (!response.ok) return { data: null, error: { message: data.error_description || data.msg || '登录失败' } };

                this._session = data;
                if (window.parent.Zotero && window.parent.Zotero.VibeDBSync) {
                    window.parent.Zotero.VibeDBSync.saveSupabaseSession(data);
                }
                return { data: { user: data.user, session: data }, error: null };
            },
            async getUser() {
                const sync = window.parent?.Zotero?.VibeDBSync;
                let session = this._session;
                if (!session && sync) {
                    session = sync._loadSessionFromPrefs();
                    this._session = session;
                }

                // 强制验证 session 与当前 Supabase 项目是否匹配
                if (session && sync && !sync.isSessionFromCurrentProject(session)) {
                    console.log('[AccountStatus] ⚠️ Stored session belongs to a different Supabase project (CN/Global mismatch); clearing login state and redirecting to login');
                    await this.signOut();
                    return { data: { user: null }, error: null };
                }

                // 优先检查父窗口的 _currentUser（内存中的用户信息）
                // 这是最快速的判断，避免不必要的网络请求
                try {
                    if (sync) {
                        const currentUser = sync.getCurrentUser();
                        if (currentUser && currentUser.id && currentUser.email) {
                            // 通过 _getAccessToken() 获取 token（会自动刷新过期 token）
                            let token = null;
                            if (window.parent.Zotero.VibeDBCloudSync && window.parent.Zotero.VibeDBCloudSync._getAccessToken) {
                                token = await window.parent.Zotero.VibeDBCloudSync._getAccessToken();
                            }
                            if (!token) {
                                // token 刷新也失败了，说明真正过期
                                return { data: { user: null }, error: null };
                            }
                            if (!sync.isTokenFromCurrentProject(token)) {
                                console.log('[AccountStatus] Current token belongs to a different Supabase project; clearing login state');
                                await this.signOut();
                                return { data: { user: null }, error: null };
                            }
                            // token 有效（可能是刷新后的新 token），直接用 _currentUser 作为用户信息
                            return { data: { user: currentUser }, error: null };
                        }
                    }
                } catch (e) {
                    console.error('检查 currentUser 失败:', e);
                }

                // 降级：尝试从 session 中获取
                if (!session) return { data: { user: null }, error: null };

                try {
                    const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                        method: 'GET',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
                    });
                    if (!response.ok) return { data: { user: null }, error: null };
                    const user = await response.json();
                    return { data: { user }, error: null };
                } catch (e) {
                    return { data: { user: null }, error: e };
                }
            },
            async signOut() {
                this._session = null;
                if (window.parent.Zotero && window.parent.Zotero.VibeDBSync) {
                    window.parent.Zotero.VibeDBSync.clearUser();
                }
                return { error: null };
            }
        };

        async function loadUserBalance() {
            const refreshBtn = document.getElementById('refresh-balance-btn');
            if (refreshBtn) refreshBtn.classList.add('loading');

            try {
                if (!window.parent.Zotero?.VibeDBSync) return;
                const balance = await window.parent.Zotero.VibeDBSync.getUserBalance();

                if (balance) {
                    const subInfo = balance.subscription_info;
                    const ub = balance.user_balance_detail || {};

                    const subStatus = document.getElementById('sub-status');
                    const subDate = document.getElementById('sub-date');

                    if (subInfo && subInfo.status === 'active') {
                        const rawTier = String(subInfo.plan_tier || '').toUpperCase();
                        const tierName = { 'LITE': 'Lite', 'PRO': 'Pro', 'ULTIMATE': 'Ultimate' }[rawTier] || subInfo.plan_tier;
                        subStatus.textContent = tierName;
                        const tierClass = { 'LITE': 'tier-lite', 'PRO': 'tier-pro', 'ULTIMATE': 'tier-ultimate' }[rawTier] || 'tier-pro';
                        subStatus.className = `badge ${tierClass}`;

                        const now = new Date();
                        const expiryDate = new Date(subInfo.current_period_end);
                        const daysLeft = Math.ceil((expiryDate - now) / (1000 * 60 * 60 * 24));

                        let dateHtml = `还有 ${daysLeft} 天到期`;

                        const bc = String(subInfo.billing_cycle || '').toUpperCase();
                        if ((bc === 'YEARLY' || bc === 'QUARTERLY') && subInfo.last_balance_reset) {
                            const nextReset = new Date(new Date(subInfo.last_balance_reset).getTime() + (30 * 24 * 60 * 60 * 1000));
                            const resetDaysLeft = Math.ceil((nextReset - now) / (1000 * 60 * 60 * 24));
                            if (resetDaysLeft > 0) {
                                dateHtml += `<br>还有 ${resetDaysLeft} 天重置月度额度`;
                            }
                        }
                        subDate.innerHTML = dateHtml;

                        // 与后端一致：订阅可用 = quota + carryover - used（不低于 0）
                        const q = Number(subInfo.credits_quota) || 0;
                        const carry = Number(subInfo.credits_carryover ?? 0) || 0;
                        const u = Number(subInfo.credits_used) || 0;
                        const subRemain = Math.max(0, q + carry - u);

                        document.getElementById('credits-balance').textContent = balance.credits || 0;
                        document.getElementById('credits-detail').textContent =
                            `订阅 ${subRemain}（月额度 ${q} + 上月剩余 ${carry} − 已用 ${u}）+ 非订阅 ${ub.credits || 0}`;
                    } else {
                        subStatus.textContent = 'Free';
                        subStatus.className = 'badge';
                        subDate.textContent = ''; // 去掉“无订阅套餐”字样

                        document.getElementById('credits-balance').textContent = balance.credits || 0;

                        const buyLink = document.getElementById('buy-link');
                        if (buyLink) buyLink.style.display = 'inline';
                    }
                }
            } catch (e) {
                console.error(e);
            } finally {
                if (refreshBtn) refreshBtn.classList.remove('loading');
                localizeDomToEnglish();
            }
        }

        // ========== Cloud Sync ==========
        async function loadSyncQuota() {
            try {
                const quota = await window.parent.Zotero.VibeDBCloudSync.getCloudSyncQuota();
                if (!quota || quota.error) return;

                const usedBytes = Number(quota.used_bytes);
                const totalBytes = Number(quota.total_quota_bytes);
                const totalMB = (totalBytes / 1024 / 1024).toFixed(0);
                const remainingBytes = Math.max(0, totalBytes - usedBytes);
                const isQuotaEmpty = quota.over_quota || remainingBytes <= 0;
                let remainingText = '0KB';
                if (remainingBytes >= 1024 * 1024) {
                    remainingText = `${(remainingBytes / 1024 / 1024).toFixed(1)}MB`;
                } else if (remainingBytes >= 1024) {
                    remainingText = `${(remainingBytes / 1024).toFixed(1)}KB`;
                } else if (remainingBytes > 0) {
                    remainingText = '<1KB';
                }
                const row = document.getElementById('sync-quota-row');
                const text = document.getElementById('sync-quota-text');
                if (row && text) {
                    text.textContent = `云空间剩余 ${remainingText} / ${totalMB}MB`;
                    text.style.color = isQuotaEmpty ? 'var(--error-text)' : '';
                    row.style.display = 'flex';
                }
            } catch (e) {
                console.error('loadSyncQuota failed:', e);
            }
            localizeDomToEnglish();
        }

        function setSyncingState(isSyncing) {
            const btn = document.getElementById('sync-btn');
            const label = btn?.querySelector('.sync-label');
            const fullSyncBtn = document.getElementById('full-sync-btn');
            if (!btn) return;

            btn.disabled = !!isSyncing;

            if (label) {
                label.textContent = isSyncing ? '同步中…' : '同步数据';
            }
            if (fullSyncBtn) {
                fullSyncBtn.disabled = !!isSyncing;
                fullSyncBtn.textContent = isSyncing ? '同步中…' : '全量同步';

            localizeDomToEnglish();

        function updateSyncProgress(progress = {}) {
            const btn = document.getElementById('sync-btn');
            const label = btn?.querySelector('.sync-label');
            if (!label) return;

            const uploadCompleted = Number(progress.uploadCompleted) || 0;
            const uploadTotal = Number(progress.uploadTotal) || 0;
            const downloadCompleted = Number(progress.downloadCompleted) || 0;
            const downloadTotal = Number(progress.downloadTotal) || 0;

            const parts = [];
            if (uploadTotal > 0) {
                parts.push(`上行同步 ${Math.min(uploadCompleted, uploadTotal)}/${uploadTotal}`);
            }
            if (downloadTotal > 0) {
                parts.push(`下行同步 ${Math.min(downloadCompleted, downloadTotal)}/${downloadTotal}`);
            }

            label.textContent = parts.length
                ? `同步中… (${parts.join('，')})`
                : '同步中…';
            localizeDomToEnglish();
        }

        async function handleSync() {
            const btn = document.getElementById('sync-btn');
            const resultEl = document.getElementById('sync-result');
            if (!btn) return;

            // Check if already syncing
            if (window.parent.Zotero?.VibeDBCloudSync?.isSyncing?.()) {
                showSyncResult('info', '同步正在进行中，请稍候…');
                return;
            }

            // Start sync UI
            setSyncingState(true);
            if (resultEl) resultEl.className = 'sync-result'; // hide previous result

            try {
                const result = await window.parent.Zotero.VibeDBCloudSync.syncAll(false, {
                    trigger: 'manual-unified-button',
                    direction: 'both',
                    onProgress: updateSyncProgress
                });

                if (result && result.success) {
                    const parts = [];
                    const uploadedPapers = result.uploadedPapers || 0;
                    const downloadedPapers = result.downloadedPapers || 0;
                    const failedPapers = result.failedPapers || 0;
                    const quotaBlocked = result.quotaBlockedPapers || 0;
                    if (uploadedPapers > 0) parts.push(`上行同步 ${uploadedPapers} 篇论文`);
                    if (downloadedPapers > 0) parts.push(`下行同步 ${downloadedPapers} 篇论文`);
                    if (failedPapers > 0) parts.push(`${failedPapers} 篇失败`);

                    if (quotaBlocked > 0) {
                        const detailParts = [];
                        if (quotaBlocked > 0) detailParts.push(`${quotaBlocked} 篇论文未能上行同步`);
                        if (downloadedPapers > 0) detailParts.push(`下行同步 ${downloadedPapers} 篇论文`);
                        showSyncResult('error', '云空间容量不足，同步失败：' + detailParts.join('，'));
                    } else if (parts.length === 0) {
                        showSyncResult('success', '所有数据已是最新');
                    } else if (failedPapers > 0) {
                        showSyncResult('error', parts.join('，') + '（失败项将在下次重试）');
                    } else {
                        showSyncResult('success', '同步完成：' + parts.join('，'));
                    }

                    // Notify reader to refresh if downloaded new data
                    if ((result.downloaded || 0) > 0) {
                        try {
                            await window.parent.Zotero.VibeDB.Papers.refreshItemIDCache();
                        } catch (e) { /* ignore */ }
                        try {
                            window.parent.Services.obs.notifyObservers(null, 'vibedb-download-finished', JSON.stringify({
                                downloaded: result.downloaded || 0
                            }));
                        } catch (e) { /* ignore */ }
                    }
                } else {
                    showSyncResult('error', '同步失败：' + (result?.message || '未知错误'));
                }
            } catch (e) {
                showSyncResult('error', '同步失败：' + (e.message || String(e)));
            } finally {
                setSyncingState(false);
                updateSyncLastTime();
                loadSyncQuota();
            }
        }

        function toggleSyncTooltip(event) {
            event.stopPropagation();
            const tooltip = document.getElementById('sync-info-tooltip');
            if (tooltip) {
                tooltip.classList.toggle('visible');
            }
        }

        function closeSyncTooltip() {
            const tooltip = document.getElementById('sync-info-tooltip');
            if (tooltip) {
                tooltip.classList.remove('visible');
            }
        }

        // Close tooltip when clicking outside
        document.addEventListener('click', function (e) {
            const wrapper = document.querySelector('.sync-info-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                closeSyncTooltip();
            }
        });

        async function handleFullSync(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            const fullSyncBtn = document.getElementById('full-sync-btn');
            const resultEl = document.getElementById('sync-result');

            if (window.parent.Zotero?.VibeDBCloudSync?.isSyncing?.()) {
                showSyncResult('info', '同步正在进行中，请稍候…');
                return;
            }

            // Disable the full sync button
            if (fullSyncBtn) {
                fullSyncBtn.disabled = true;
                fullSyncBtn.textContent = '同步中…';
            }
            setSyncingState(true);
            if (resultEl) resultEl.className = 'sync-result';

            try {
                const result = await window.parent.Zotero.VibeDBCloudSync.syncAll(true, {
                    trigger: 'manual-full-sync-button',
                    direction: 'both',
                    onProgress: updateSyncProgress
                });

                if (result && result.success) {
                    const parts = [];
                    const uploadedPapers = result.uploadedPapers || 0;
                    const downloadedPapers = result.downloadedPapers || 0;
                    const failedPapers = result.failedPapers || 0;
                    const quotaBlocked = result.quotaBlockedPapers || 0;
                    if (uploadedPapers > 0) parts.push(`上行同步 ${uploadedPapers} 篇论文`);
                    if (downloadedPapers > 0) parts.push(`下行同步 ${downloadedPapers} 篇论文`);
                    if (failedPapers > 0) parts.push(`${failedPapers} 篇失败`);

                    if (quotaBlocked > 0) {
                        const detailParts = [];
                        if (quotaBlocked > 0) detailParts.push(`${quotaBlocked} 篇论文未能上行同步`);
                        if (downloadedPapers > 0) detailParts.push(`下行同步 ${downloadedPapers} 篇论文`);
                        showSyncResult('error', '云空间容量不足，全量同步失败：' + detailParts.join('，'));
                    } else if (parts.length === 0) {
                        showSyncResult('success', '全量同步完成：所有数据已是最新');
                    } else if (failedPapers > 0) {
                        showSyncResult('error', '全量同步：' + parts.join('，') + '（失败项将在下次重试）');
                    } else {
                        showSyncResult('success', '全量同步完成：' + parts.join('，'));
                    }

                    if ((result.downloaded || 0) > 0) {
                        try {
                            await window.parent.Zotero.VibeDB.Papers.refreshItemIDCache();
                        } catch (e) { /* ignore */ }
                        try {
                            window.parent.Services.obs.notifyObservers(null, 'vibedb-download-finished', JSON.stringify({
                                downloaded: result.downloaded || 0
                            }));
                        } catch (e) { /* ignore */ }
                    }
                } else {
                    showSyncResult('error', '全量同步失败：' + (result?.message || '未知错误'));
                }
            } catch (e) {
                showSyncResult('error', '全量同步失败：' + (e.message || String(e)));
            } finally {
                if (fullSyncBtn) {
                    fullSyncBtn.disabled = false;
                    fullSyncBtn.textContent = '全量同步';
                }
                setSyncingState(false);
                updateSyncLastTime();
                loadSyncQuota();
            }
        }

        // Expose for parent to call
        window.handleFullSync = handleFullSync;
        window.handleSync = handleSync;
        window.updateSyncLastTime = updateSyncLastTime;
        window.setSyncingState = setSyncingState;

        window.refreshBalance = loadUserBalance;
        window.showLoginView = showLoginView;
        window.showStatus = showStatus;

        init();
    </script>
</body>

</html>
