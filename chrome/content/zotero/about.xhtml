<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/about.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<!DOCTYPE window SYSTEM "chrome://zotero/locale/about.dtd">

<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	onload="moveToAlertPosition(); sizeToContent(); document.getElementById('zotero-about').getButton('accept').focus();"
	inwindowmenu="false">
	<script>
		Services.scriptloader.loadSubScript("chrome://zotero/content/include.js", this);
		Services.scriptloader.loadSubScript("chrome://zotero/content/customElements.js", this);
	</script>
<dialog
		id="zotero-about"
		class="zotero-window"
		buttons="accept"
		buttonlabelaccept="&zotero.about.close;"
		ondialogaccept="return true;">
	
	<vbox id="aboutcontent" class="zotero-dialog">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<img id="logo" src="chrome://zotero/skin/icons/Vibero.png" alt="ForPaper" style="width: 64px; height: 64px;" />
		</div>
		<hbox>
			<label id="version"/>
			<label id="changelog" is="zotero-text-link" value="&zotero.whatsNew;"/>
		</hbox>
		<script>
			// 显示 ForPaper 版本号
			var vibeZoteroVersion = Services.prefs.getCharPref('extensions.zotero.vibeZotero.version', '1.0.0');
			document.getElementById('version').textContent = `ForPaper ${vibeZoteroVersion}`;
		</script>
		
		<!-- 版本信息和检查更新 -->
		<vbox style="border: 1px solid var(--fill-quinary); padding: 12px; border-radius: 6px; background-color: var(--material-sidepane); margin: 12px 0;">
			<hbox align="center">
				<label id="label-current-version" style="font-weight: 500; width: 80px;">Current:</label>
				<label id="current-version" style="margin-right: 10px;"></label>
				<button id="check-update-btn" label="Check Updates" style="padding: 4px 12px; font-size: 12px;" />
			</hbox>
			<hbox style="margin-top: 8px;">
				<label id="label-update-status" style="font-weight: 500; width: 80px;">Status:</label>
				<label id="update-status" style="flex: 1; color: var(--fill-secondary);">Click "Check Updates" to check the latest version</label>
			</hbox>
		</vbox>
		
		<vbox>
			<div id="about-text" xmlns="http://www.w3.org/1999/xhtml">
				<p id="about-intro-1" style="margin: 8px 0; line-height: 1.6;">
					<strong>ForPaper</strong> is the world's first vibe reading AI tool.
				</p>
				<p id="about-intro-2" style="margin: 8px 0; line-height: 1.6;">
					Built on <span class="text-link" data-href="https://www.zotero.org">Zotero</span>, fully compatible with the Zotero ecosystem and its plugins.
				</p>
				<script><![CDATA[
					function isZhLocale() {
						return String(Zotero?.locale || Services.locale.appLocaleAsBCP47 || navigator.language || 'en-US').toLowerCase().startsWith('zh');
					}

					const i18n = {
						zh: {
							currentLabel: '当前版本:',
							updateLabel: '更新状态:',
							checkUpdates: '检查更新',
							updateIdle: '点击"检查更新"查看最新版本',
							updateChecking: '正在检查更新...',
							updateLatest: '已检查，ForPaper 已是最新版本',
							updateFailed: '检查更新失败，请稍后重试',
							about1: '<strong>ForPaper</strong> 是全球首款氛围阅读 AI 工具。',
							about2: '基于 <span class="text-link" data-href="https://www.zotero.org">Zotero</span> 构建，完全兼容 Zotero 生态系统，支持所有 Zotero 插件和功能。',
							logPrefix: '[About Dialog]'
						},
						en: {
							currentLabel: 'Current:',
							updateLabel: 'Status:',
							checkUpdates: 'Check Updates',
							updateIdle: 'Click "Check Updates" to check the latest version',
							updateChecking: 'Checking for updates...',
							updateLatest: 'Checked. ForPaper is up to date.',
							updateFailed: 'Update check failed. Please try again later.',
							about1: "<strong>ForPaper</strong> is the world's first vibe reading AI tool.",
							about2: 'Built on <span class="text-link" data-href="https://www.zotero.org">Zotero</span>, fully compatible with the Zotero ecosystem and its plugins.',
							logPrefix: '[About Dialog]'
						}
					};

					const L = isZhLocale() ? i18n.zh : i18n.en;
					document.getElementById('label-current-version').textContent = L.currentLabel;
					document.getElementById('label-update-status').textContent = L.updateLabel;
					document.getElementById('check-update-btn').setAttribute('label', L.checkUpdates);
					document.getElementById('update-status').textContent = L.updateIdle;
					document.getElementById('about-intro-1').innerHTML = L.about1;
					document.getElementById('about-intro-2').innerHTML = L.about2;

					// 初始化版本信息
					var vibeZoteroVersion = Services.prefs.getCharPref('extensions.zotero.vibeZotero.version', '1.0.0');
					document.getElementById('current-version').textContent = vibeZoteroVersion;
					
					// 检查更新功能
					document.getElementById('check-update-btn').addEventListener('click', async function() {
						let statusLabel = document.getElementById('update-status');
						statusLabel.textContent = L.updateChecking;
						statusLabel.style.color = 'var(--fill-secondary)';
						
						try {
							await Zotero.checkVibeZoteroUpdates();
							// 更新完成后刷新状态
							let currentVersion = Services.prefs.getCharPref('extensions.zotero.vibeZotero.version', '1.0.0');
							document.getElementById('current-version').textContent = currentVersion;
							document.getElementById('version').textContent = `ForPaper ${currentVersion}`;
							statusLabel.textContent = L.updateLatest;
							statusLabel.style.color = '#28a745';
						} catch (e) {
							console.error(`${L.logPrefix} Update check failed:`, e);
							statusLabel.textContent = L.updateFailed;
							statusLabel.style.color = '#dc3545';
							Zotero.logError(e);
						}
					});
					
					const { ZOTERO_CONFIG } = ChromeUtils.importESModule('resource://zotero/config.mjs');
					document.getElementById('changelog').href = ZOTERO_CONFIG.CHANGELOG_URL;
					
					// 激活文本链接
					for (let span of document.getElementById('about-text').getElementsByTagName('span')) {
						span.className = 'text-link';
						span.setAttribute('role', 'link');
						span.onclick = function () {
							Zotero.launchURL(this.getAttribute('data-href'));
						};
					}
				]]></script>
			</div>
		</vbox>
	</vbox>
</dialog>
</window>
